name: assess_gallery
description: "This is a flutter application that can upload an image and also display for preview"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.5.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dotted_border: ^2.1.0
  get: ^4.7.2
  camera: ^0.10.6
  image_picker: ^1.1.2
  permission_handler: ^12.0.0+1
  fluttertoast: ^8.2.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true

